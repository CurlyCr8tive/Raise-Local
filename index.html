<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raise Local Matchmaking</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
        <span class="brand-mark" aria-hidden="true">R</span>
        <div>
          <strong>Raise Local</strong>
          <span>Raise Funds. Buy Local.</span>
        </div>
    </div>
    <nav aria-label="Main navigation">
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="requests">Campaign Requests</button>
      <button class="nav-btn" data-view="businesses">Business Profiles</button>
      <button class="nav-btn" data-view="matches">Match Review</button>
      <button class="nav-btn" data-view="brief">Build Brief</button>
    </nav>
  </aside>

  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Powered by Verified Consulting</p>
        <h1 id="page-title">Raise Local Dashboard</h1>
      </div>
      <button class="primary-btn" id="seed-btn">Reset Demo Data</button>
    </header>

    <section id="view-root" class="view-root"></section>
  </main>

  <script type="module" src="src/app.js"></script>

</html>
