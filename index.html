<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raise Local Matchmaking</title>
  <link rel="icon" href="assets/raise-local-symbol-hires.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar" id="app-sidebar">
    <div class="brand">
      <img src="assets/raise-local-logo-hires.png" alt="Raise Local" />
      <span>Local People. Stronger Communities.</span>
    </div>
    <nav aria-label="Main navigation">
      <button class="nav-btn" data-view="dashboard"><span class="nav-label">Dashboard</span></button>
      <button class="nav-btn" data-view="requests"><span class="nav-label">Campaign Requests</span><span class="nav-badge" data-nav-badge="requests"></span></button>
      <button class="nav-btn" data-view="businesses"><span class="nav-label">Business Profiles</span><span class="nav-badge" data-nav-badge="businesses"></span></button>
      <button class="nav-btn" data-view="matches"><span class="nav-label">Match Review</span><span class="nav-badge" data-nav-badge="matches"></span></button>
      <button class="nav-btn" data-view="messages" disabled title="Coming soon"><span class="nav-label">Messages</span><span class="nav-badge" data-nav-badge="messages"></span></button>
      <button class="nav-btn" data-view="projects" disabled title="Coming soon"><span class="nav-label">My Projects</span></button>
      <button class="nav-btn" data-view="reports" disabled title="Coming soon"><span class="nav-label">Reports</span></button>
      <button class="nav-btn" data-view="settings"><span class="nav-label">Settings</span></button>
      <button class="nav-btn" data-view="brief"><span class="nav-label">Build Brief</span></button>
    </nav>

    <div class="sidebar-support">
      <span class="support-icon" data-icon="headset"></span>
      <div>
        <strong>Need support?</strong>
        <span class="muted">We're here to help.</span>
      </div>
    </div>
    <a class="secondary-btn sidebar-support-btn" href="mailto:hello@raiselocal.example">Contact Team</a>

    <div class="sidebar-account">
      <div class="account-identity">
        <span class="account-avatar" id="account-avatar">?</span>
        <div>
          <span class="account-email" id="account-email">—</span>
          <span class="account-role" id="account-role"></span>
        </div>
      </div>
      <button class="nav-btn logout-btn" id="logout-btn" type="button">Log Out</button>
    </div>
  </aside>

  <main class="app-shell">
    <header class="topbar" id="app-topbar">
      <div class="search-wrap">
        <span class="input-icon" data-icon="search"></span>
        <input class="search-input" type="search" placeholder="Search businesses, nonprofits, or keywords..." disabled title="Search coming soon" />
      </div>
      <div>
        <p class="eyebrow">Powered by Verified Consulting</p>
        <h1 id="page-title">Raise Local Dashboard</h1>
      </div>
      <div class="topbar-actions">
        <div class="topbar-account">
          <button class="icon-btn" type="button" id="notif-btn" aria-label="Notifications">
            <span data-icon="bell"></span>
            <span class="notif-badge" id="notif-badge" hidden>0</span>
          </button>
          <div class="topbar-account-menu notif-menu" id="notif-menu" hidden></div>
        </div>
        <div class="topbar-account">
          <button class="topbar-account-btn" type="button" id="topbar-account-btn">
            <span class="account-avatar" id="topbar-account-avatar">?</span>
            <span class="topbar-account-name" id="topbar-account-name">Account</span>
            <span class="chevron" data-icon="chevronDown"></span>
          </button>
          <div class="topbar-account-menu" id="topbar-account-menu" hidden>
            <button type="button" id="account-profile-btn">Account &amp; Profile</button>
            <button type="button" id="seed-btn">Reset Demo Data</button>
            <button type="button" id="topbar-logout-btn">Log Out</button>
          </div>
        </div>
      </div>
    </header>

    <section id="view-root" class="view-root"></section>
  </main>

  <script type="module" src="src/app.js?v=3607856"></script>
</body>
</html>
